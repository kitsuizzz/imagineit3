[project]
name = "imagineit-backend"
version = "3.1"
description = "GPU backend for imagineit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "dotenv",
    "sqlalchemy",
    "aiomysql",
    "greenlet",
    "alembic",
    "minio",
    "valkey",
    "huggingface_hub",
    "transformers; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
nvidia = [
    "torch",
    "torchvision",
]
amd = [
    "torch",
    "torchvision",
]
intel = [
    "torch",
    "torchvision",
]
metal = [
    "mlx",
    "regex",
]

[tool.uv.sources]
# Instructs uv to route torch and torchvision to their dedicated hardware repositories
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "nvidia" },
    { index = "pytorch-rocm", extra = "amd" },
    { index = "pytorch-intel", extra = "intel" }
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "nvidia" },
    { index = "pytorch-rocm", extra = "amd" },
    { index = "pytorch-intel", extra = "intel" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-intel"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
