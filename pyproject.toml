[project]
name = "imagineit-backend"
version = "3.2"
description = "App backend and outbound GPU worker for ImagineIt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "sqlalchemy",
    "aiomysql",
    "greenlet",
    "alembic",
    "minio",
    "valkey",
    "cryptography>=42",
]

[project.optional-dependencies]
gpu = [
    "websockets>=13",
    "pillow",
    "numpy",
    "tqdm",
    "huggingface_hub[cli]",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "regex; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers; sys_platform == 'linux' or sys_platform == 'win32'",
    "diffusers; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch; sys_platform == 'linux' or sys_platform == 'win32'",
]
dev = [
    "pytest",
    "httpx2",
]

[project.scripts]
imagineit-gpu-worker = "gpu.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "shared", "gpu"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
