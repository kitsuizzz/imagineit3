[project]
name = "imagineit-backend"
version = "3.1"
description = "GPU backend for imagineit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "dotenv",
    "sqlalchemy",
    "aiomysql",
    "greenlet",
    "alembic",
    "minio",
    "valkey",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
