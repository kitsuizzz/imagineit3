[project]
name = "imagineit-backend"
version = "3.1"
description = "GPU backend for imagineit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "dotenv",
    "sqlalchemy",
    "aiomysql",
    "greenlet",
    "alembic",
    "minio",
    "valkey",
    "huggingface_hub[cli]",
    "regex",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch; sys_platform == 'linux' or sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
